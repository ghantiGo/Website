<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} - {{ site.data.site.app_name }}{% else %}{{ site.data.site.app_name }} - {{ site.data.site.tagline }}{% endif %}</title>

    <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
    <meta name="theme-color" content="#FBF5EA" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#15130F" media="(prefers-color-scheme: dark)">

    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ site.data.site.url }}{{ page.url }}">
    <meta property="og:title" content="{% if page.title %}{{ page.title }} - {{ site.data.site.app_name }}{% else %}{{ site.data.site.app_name }} - {{ site.data.site.tagline }}{% endif %}">
    <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
    <meta property="og:image" content="{{ site.data.site.url }}/assets/images/og-image.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="{{ site.data.site.url }}{{ page.url }}">
    <meta name="twitter:title" content="{% if page.title %}{{ page.title }} - {{ site.data.site.app_name }}{% else %}{{ site.data.site.app_name }} - {{ site.data.site.tagline }}{% endif %}">
    <meta name="twitter:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
    <meta name="twitter:image" content="{{ site.data.site.url }}/assets/images/og-image.png">

    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="48x48">
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}" sizes="any">
    <link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wdth,wght@75..125,100..800&family=Anek+Latin:wdth,wght@75..125,100..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    {% if page.layout == 'legal' %}
    <link rel="stylesheet" href="{{ '/assets/css/legal.css' | relative_url }}">
    {% endif %}
    <script>document.documentElement.classList.add('js');</script>
</head>
<body class="scope">
    <a class="skip-link" href="#main">Skip to content</a>
    {% include nav.html %}
    <main id="main">
    {{ content }}
    </main>
    {% include footer.html %}
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
    {% if page.url == '/' %}
    <script src="{{ '/assets/js/waitlist.js' | relative_url }}" defer></script>
    {% endif %}
</body>
</html>

{% assign d = site.data.deletion %}
<form id="deletion-form" class="waitlist deletion" method="post" novalidate data-endpoint="{{ site.deletion_endpoint }}">
    <div data-step="ask">
        <fieldset class="waitlist-roles">
            <legend>{{ d.role_legend }}</legend>
            {% for role in d.roles %}
            <label class="waitlist-role">
                <input type="radio" name="role" value="{{ role.value }}" data-key="{{ role.key }}" required>
                <span>{{ role.label }}</span>
            </label>
            {% endfor %}
            <p class="field-error" id="del-role-error" role="alert" hidden></p>
        </fieldset>

        <div class="waitlist-field">
            <label for="del-phone">{{ d.phone_label }}</label>
            <div class="phone-row">
                <span class="phone-prefix" aria-hidden="true">+91</span>
                <input id="del-phone" name="phone_number" type="tel" inputmode="tel" autocomplete="tel-national" maxlength="20" required aria-describedby="del-phone-error">
            </div>
            <p class="field-error" id="del-phone-error" role="alert" hidden></p>
        </div>

        <button type="button" class="btn waitlist-submit" data-send data-sending="{{ d.sending_text }}">{{ d.send_text }}</button>
    </div>

    <div data-step="confirm" hidden>
        <div class="waitlist-field">
            <label for="del-code">{{ d.code_label }}</label>
            <input class="text-input" id="del-code" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8" aria-describedby="del-code-hint del-code-error">
            <p class="field-hint" id="del-code-hint">{{ d.code_hint }}</p>
            <p class="field-error" id="del-code-error" role="alert" hidden></p>
        </div>

        <button type="submit" class="btn waitlist-submit" data-confirm data-sending="{{ d.deleting_text }}">{{ d.confirm_text }}</button>
        <p><button type="button" class="deletion-back" data-back>{{ d.back_text }}</button></p>
    </div>

    <p class="waitlist-status" id="del-status" role="status" aria-live="polite"></p>
    <noscript><p class="waitlist-status error">Turn on JavaScript to use this form, or email us using the address below.</p></noscript>
    <script type="application/json" id="del-messages">{{ d.messages | jsonify }}</script>
</form>

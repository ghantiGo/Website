# Everyone who comes by — the trades marquee, the two rhythms (weekly, once),
# the real photos, and the villages note. Photos are real lanes only; the site never fakes one.

marquee:
  - ["Kulfi", "Jhalmuri", "Sabzi", "Ganne ka ras", "Iron kadhai", "Bike wash"]
  - ["Knife sharpening", "Mixer repair", "Cycle repair", "Chair repair", "Kalai", "Tempo sellers"]

label: "Who comes"
title: "Everyone who comes by."
subtitle: "Some come every week. Some come once. All of them are on one timetable."

rhythms:
  - heading: "Every week"
    lead: "Feriwale & tempo sellers"
    text: "Mixer, chair and cycle repair, bike wash, knife sharpening, kulfi, jhalmuri, sabzi, iron kadhai, and the tempo or van that comes round."

  - heading: "Once"
    lead: "Camps"
    text: "Health, eye, dental, Aadhaar and blood donation camps, collection camps for old idols and books, fairs and exhibitions. Announced before the day, with the place, time and what to bring."

photos:
  - image: "/assets/images/feriwale/iron-utensils.webp"
    alt: "Iron kadhai and tawas laid out on a yellow sheet by the roadside"
    caption: "Iron kadhai and tawas, laid out by the road."
    width: 600
    height: 450

  - image: "/assets/images/feriwale/jhalmuri-seller.webp"
    alt: "Jhalmuri seller standing beside his cart"
    caption: "The jhalmuri cart at the chowk, every evening."
    width: 600
    height: 450

  - image: "/assets/images/feriwale/knife-sharpner.webp"
    alt: "Knife sharpener working a grinding wheel mounted on his motorbike"
    caption: "The knife sharpener and his wheel."
    width: 450
    height: 600

rural:
  label: "Next"
  title: "Villages, after Pune."
  hindi: "गाँव का टाइमटेबल"
  items:
    - title: "Feriwale on cycle"
      text: "The bangle seller, the kalai wala who re-tins brass pots, the fish seller, the kulfi cycle. Know their day in your gaon."

    - title: "Pashu camps"
      text: "Veterinary and vaccination camps for cattle, announced before the day."

    - title: "Health & Aadhaar camps"
      text: "At the school or panchayat ground. Know the date, time and what to bring."

# /explain/ — GhantiGo explained in four short chapters of animated slides.
# To add a language: add it to `languages`, then add its code under `ui`, each deck's `name` and `title`, and each slide's `caption`.
# A missing line falls back to English. `alt` is what a screen reader hears for the picture.
# Slides are drawn in order by _includes/explain_scenes.html: the first slide of the first deck is picture 1, and so on.

title: "GhantiGo, explained"
description: "GhantiGo in short animated chapters: how it works, the gap it fills, what changes, and where it sits."

languages:
  - code: "en"
    name: "English"
  - code: "hi"
    name: "हिन्दी"
  - code: "mr"
    name: "मराठी"


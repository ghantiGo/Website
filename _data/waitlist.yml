# The waitlist form. The one thing we send, once, is an SMS when the apps launch.
# notice_version names the wording of consent_label; it is bumped whenever consent_label changes.

title: "Be first in your lane."
subtitle: "Free. Leave your mobile number. One SMS when the app launches in Pune."

role_legend: "I am a"
roles:
  - value: "resident"
    label: "Customer"
  - value: "peddler"
    label: "Feriwala or tempo seller"
  - value: "camp_manager"
    label: "Camp organiser"

phone_label: "Mobile number"

locality_label: "Which city or locality?"
locality_placeholder: "Baner, Pune"
interest_hint: "Optional. Please don't write personal details."
interest_label: "Anything else?"
interest_placeholder: "Tell us in your own words"
choices:
  - role: "resident"
    legend: "What are you looking for?"
    options:
      - {value: "fruits_vegetables", label: "Fruits and vegetables"}
      - {value: "ice_cream_kulfi", label: "Ice cream and kulfi"}
      - {value: "knife_sharpening", label: "Knife sharpening"}
      - {value: "utensil_repair", label: "Utensil repair and kalai"}
      - {value: "home_repairs", label: "Home repairs"}
      - {value: "camps", label: "Camps in my area"}
  - role: "peddler"
    legend: "What do you sell?"
    options:
      - {value: "fruits_vegetables", label: "Fruits and vegetables"}
      - {value: "ice_cream_kulfi", label: "Ice cream and kulfi"}
      - {value: "snacks", label: "Snacks"}
      - {value: "household_items", label: "Household items"}
      - {value: "repairs_sharpening", label: "Repairs and sharpening"}
      - {value: "service", label: "A service"}
  - role: "camp_manager"
    legend: "What kind of camp do you run?"
    options:
      - {value: "eye_checkup", label: "Eye check-up"}
      - {value: "blood_donation", label: "Blood donation"}
      - {value: "vaccination", label: "Vaccination"}
      - {value: "other_camps", label: "Other camps"}
submit_text: "Join the waitlist"
sending_text: "Sending…"
noscript: "Turn on JavaScript to join the waitlist, or call us on the number below."

notice_version: "v2"
consent_label: "I agree to be contacted by GhantiGo about the app launch. I agree to the <a href=\"/terms/\">Terms of Service</a> and <a href=\"/privacy-policy/\">Privacy Policy</a>, and I am 18 or older."

messages:
  success: "You're on the list. We will tell you when the app launches in Pune."
  role: "Choose who you are."
  phone: "Enter your 10-digit mobile number, starting with 6, 7, 8 or 9. A leading 0 is fine."
  consent: "Tick the box to say you agree."
  too_many: "Too many tries just now. Please wait a few minutes and try again."
  offline: "No connection right now. Your details are still here, so try again when you are back online."
  slow: "That took too long. Your details are still here, so please try again."
  failed: "Something went wrong on our side. Your details are still here, so please try again in a little while."

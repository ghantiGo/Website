# How It Works — the ONE place the split by app lives: resident, Partner, Camp.
#
# It used to appear twice: a Benefits grid split by persona, then this section
# split by persona again, back to back. Same division, overlapping content, no
# new information the second time. The benefit copy now lives inside the step
# descriptions — the step says what you do, the description says why it's worth
# doing. Three steps a side is the ceiling; a fourth means something is being
# explained that should be shown instead.

title: "How GhantiPlus works"
subtitle: "Feriwale and camps plan their days, and go online on the day. Residents get the ghanti."

customer_title: "For residents"
customer_subtitle: "In the GhantiPlus app"
customer_steps:
  - heading: "Pick your area"
    hindi: "अपना इलाका चुनो"
    description: "Choose your locality, society or village once, and see the feriwale who come to your lane."

  - heading: "Now and upcoming"
    hindi: "अभी और आने वाले"
    description: "See who is online now, and the upcoming ones with their date — photos, voice note and stops."

  - heading: "Walk over"
    hindi: "जाके ले आओ"
    description: "Send a short message about their post, then walk over when they are here. Local prices, no delivery fee, no middleman."

peddler_title: "For feriwale & tempo sellers"
peddler_subtitle: "In the GhantiPlus Partner app"
peddler_steps:
  - heading: "Photos & voice note"
    hindi: "फोटो और आवाज़"
    description: "Post photos of today's goods and a short voice note in your own language."

  - heading: "Plan your days"
    hindi: "अपने दिन तय करो"
    description: "Pick a date, then draw your route or pick your stands. Residents see you as upcoming."

  - heading: "Go online"
    hindi: "ऑनलाइन जाओ"
    description: "On the day, tap Go online when you start your round. Residents see you are here, so you sell more on the same round."

camp_title: "For camp organisers"
camp_subtitle: "In the GhantiPlus Camp app"
camp_steps:
  - heading: "Pick the date and place"
    hindi: "तारीख और जगह"
    description: "Choose your camp's dates, then pick the locality or pin the ground on the map."

  - heading: "Add a poster and voice"
    hindi: "पोस्टर और आवाज़"
    description: "Add photos or make a poster, and record a short voice note in your own language."

  - heading: "Publish"
    hindi: "पोस्ट करो"
    description: "Residents of that area see it as upcoming, with the date. On the day, tap We're open so they know it's on. No printing, no pasting, no loudspeaker round."

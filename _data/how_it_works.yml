# How It Works — the ONE place the split by app lives: resident, Partner, Camp.
#
# It used to appear twice: a Benefits grid split by persona, then this section
# split by persona again, back to back. Same division, overlapping content, no
# new information the second time. The benefit copy now lives inside the step
# descriptions — the step says what you do, the description says why it's worth
# doing. Three steps a side is the ceiling; a fourth means something is being
# explained that should be shown instead.

title: "How GhantiPlus works"
subtitle: "Feriwale go online. Camps announce ahead. Residents get the ghanti."

customer_title: "For residents"
customer_subtitle: "In the GhantiPlus app"
customer_steps:
  - heading: "Pick your area"
    hindi: "अपना इलाका चुनो"
    description: "Choose your locality, society or village once. The feriwale who come to your lane — kulfi, sabzi, bike wash, chair repair — show up for you, so you stop missing them."

  - heading: "Get the ghanti"
    hindi: "ऐप में घंटी"
    description: "Open the app to see who is online near your society. When a feriwala rings the bell at your gate, it shows up in the app for the next few minutes."

  - heading: "Walk over"
    hindi: "जाके ले आओ"
    description: "They're at your gate or chowk. Local prices, no delivery fee, no middleman — and repairing beats replacing."

peddler_title: "For feriwale & tempo sellers"
peddler_subtitle: "In the GhantiPlus Partner app"
peddler_steps:
  - heading: "Upload today"
    hindi: "आज का सामान"
    description: "Share a photo of what you've brought today, or the repairs you can do — so residents know before you arrive."

  - heading: "Record voice"
    hindi: "आवाज़ बोलो"
    description: "Record a short voice broadcast in your own language and style. Your voice, not a form."

  - heading: "Go online"
    hindi: "ऑनलाइन जाओ"
    description: "Tap Go online when you start your round, and ring the bell when you reach a society's gate. Residents see you — no shouting, no hoping someone hears the bell. More homes hear you, so you sell more on the same round."

camp_title: "For camp organisers"
camp_subtitle: "In the GhantiPlus Camp app"
camp_steps:
  - heading: "Pick the date and place"
    hindi: "तारीख और जगह"
    description: "Choose the day or days of your camp, then pick the locality or pin the ground on the map."

  - heading: "Add a poster and voice"
    hindi: "पोस्टर और आवाज़"
    description: "Add photos or make a poster, and record a short voice message in your own language."

  - heading: "Publish"
    hindi: "पोस्ट करो"
    description: "Residents of that area see your camp in the GhantiPlus app before the day. No printing, no pasting, no loudspeaker round."

# Closing CTA — one button per side of the marketplace, so the WhatsApp inbox
# knows who wrote: a resident, a feriwala or tempo seller, or a camp organiser.
# Every message is a complete sentence with no blank to fill in: the button
# tapped is what says who wrote, and the first reply asks for the rest.
# The hero keeps the single resident button (site.yml whatsapp_message).

buttons:
  - text: "I'm a resident"
    message: "Hi GhantiGo! I'm a resident and I want early access."

  - text: "I'm a feriwala / tempo seller"
    message: "Hi GhantiGo! I'm a feriwala / tempo seller and I want to join the Partner app."

  - text: "I run camps"
    message: "Hi GhantiGo! I run camps and I want the GhantiGo Camp app."

# The old ghanti — why the call stopped reaching.

label: "The old ghanti"
title: "The ghanti was built for the ground floor."
subtitle: "Every feriwala has a call of their own: a bell, a horn, a sing-song cry. Today it has more walls to cross."

statements:
  - "Gates, towers and traffic swallow the call."
  - "The mixer broke on Monday. The repairwala came on Sunday."
  - "Is the kulfiwala still nearby, or did you just miss him?"

bridge: "The call hasn't changed. It just needs to reach the 5th floor."

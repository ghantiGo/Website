# Challenges section — the old problem GhantiPlus solves

title: "Why the old ghanti stopped reaching"
subtitle: "Every feriwala and service provider had a way to announce themselves. Today, that voice gets lost."

items:
  - icon: "🛎️"
    text: "Their physical ghanti can't reach the 5th floor — or the far end of the gaon."

  - icon: "🏢"
    text: "Gated societies, high-rises, and busy roads block the old ways of announcing."

  - icon: "🗑️"
    text: "So we buy new instead of repairing — or miss fresh local bargains."

  - icon: "🧺"
    text: "So we lose a trip to the market, and the feriwala walks home with what didn't sell."

bridge: "GhantiPlus brings the neighbourhood bell back — in an app."

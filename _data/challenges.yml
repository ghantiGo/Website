# Challenges section — the old problem GhantiGo solves

title: "The ghanti your lane already trusts"
subtitle: "Every feriwala had a way to announce themselves. Today, that voice needs somewhere to be heard."

items:
  - icon: "🛎️"
    text: "The ghanti is lovely on the ground floor. The 5th floor and the far end of the gaon need a timetable."

  - icon: "🏢"
    text: "Gates, high-rises and busy roads carry the sound away."

  - icon: "🗑️"
    text: "Repair what you own, and catch fresh local bargains."

  - icon: "🧺"
    text: "Walk over when you know he is there, and he sells out before he walks home."

bridge: "GhantiGo brings the neighbourhood bell back — in an app."

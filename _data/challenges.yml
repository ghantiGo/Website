# Challenges section — the old problem GhantiGo solves

title: "Why the old ghanti stopped reaching"
subtitle: "Every feriwala had a way to announce themselves. Today, that voice gets lost."

items:
  - icon: "🛎️"
    text: "Their ghanti can't reach the 5th floor — or the far end of the gaon."

  - icon: "🏢"
    text: "Gated societies, high-rises and busy roads block it."

  - icon: "🗑️"
    text: "So we buy new instead of repairing — or miss fresh local bargains."

  - icon: "🧺"
    text: "So we waste a trip to the market, and the feriwala walks home with what didn't sell."

bridge: "GhantiGo brings the neighbourhood bell back — in an app."
